name: Release

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    name: Test on PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@4eb1b49da14d099ececb6701444674d140d84344
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Run tests
        run: ./vendor/bin/pest

      # Also the deprecation/warning/notice gate: phpunit.xml sets failOnDeprecation and
      # friends, which the phpunit binary honours by exiting non-zero. Pest prints the same
      # deprecations but still exits 0, so this step is what actually enforces them.
      - name: Run tests with phpunit/phpunit
        run: ./vendor/bin/phpunit

      - name: Check coverage is 100%
        run: ./vendor/bin/pest --coverage --min=100

      # Deliberately serial: with --parallel, the spawned workers do not inherit the
      # coverage-enabled environment, so --covered-only finds nothing and reports
      # "0 Mutations for 0 Files created" instead of a real score. ~45s serial is worth
      # not having a false failure block a release.
      - name: Check mutation score is 100%
        run: ./vendor/bin/pest --mutate --everything --covered-only --min=100

  sonar:
    runs-on: ubuntu-latest

    # Advisory only: a Sonar outage or an expired SONAR_TOKEN must never block a release.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@4eb1b49da14d099ececb6701444674d140d84344
        with:
          php-version: '8.2'
          extensions: mbstring, json
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate coverage report
        run: ./vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: SonarQube Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@40f5b61913e891f9d316696628698051136015be
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
